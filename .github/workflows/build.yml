name: Build Fuzion Sonora ISO

on:
  workflow_dispatch:      # lets you press a "Run workflow" button
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm archiso git

      - name: Get the project files
        uses: actions/checkout@v4

      - name: Build the ISO
        run: bash build.sh

      - name: Save the ISO so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: fuzion-sonora-iso
          path: out/*.iso
          compression-level: 0
